name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the pinned Flutter SDK.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Example app flows (headless)
        working-directory: example
        run: |
          flutter pub get
          flutter analyze
          flutter test
